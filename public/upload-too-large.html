<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>حجم الملفات أكبر من المسموح</title>
    <style>
        body { margin: 0; padding: 24px; color: #18343a; background: #f4f8f7; font-family: Tahoma, Arial, sans-serif; }
        main { max-width: 560px; margin: 12vh auto; padding: 28px; border: 1px solid #d5e2df; border-radius: 12px; background: #fff; }
        h1 { margin-top: 0; font-size: 1.5rem; }
        p { line-height: 1.8; }
        button { min-height: 44px; padding: 8px 14px; border: 1px solid #12645f; border-radius: 6px; color: #fff; background: #12645f; font: inherit; cursor: pointer; }
    </style>
</head>
<body>
<main>
    <h1>تعذر رفع المرفقات</h1>
    <p>حجم الملفات المرفقة أكبر من الحد المسموح. قلل حجم الملفات أو أرسل عددًا أقل منها، ثم حاول مرة أخرى.</p>
    <button type="button" onclick="history.back()">العودة إلى الصفحة السابقة</button>
</main>
</body>
</html>
